[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarlink"
version = "0.1.0"
description = "Extract publication authors from scientific paper URLs using Crawl4AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.1",
    "typer[all]>=0.21.1",
]

[project.scripts]
scholarlink = "scholarlink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarlink"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
